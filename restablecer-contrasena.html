<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nueva contraseña | CEIN Manuela Sáenz</title>

  <link rel="stylesheet" href="acceso.css">

  <style>
    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body class="pagina-acceso">
  <main class="contenedor-acceso">
    <section class="tarjeta-acceso" aria-labelledby="titulo-nueva-clave">

      <a href="login.html">← Volver al inicio de sesión</a>

      <h1 id="titulo-nueva-clave">Nueva contraseña</h1>

      <p class="descripcion-acceso">
        Establezca una contraseña distinta de la anterior,
        con al menos 12 caracteres.
      </p>

      <form id="formulario-restablecer" hidden>
        <label for="nueva-clave">Nueva contraseña</label>

        <input
          type="password"
          id="nueva-clave"
          autocomplete="new-password"
          minlength="12"
          required
        >

        <label for="confirmar-nueva-clave">
          Confirmar nueva contraseña
        </label>

        <input
          type="password"
          id="confirmar-nueva-clave"
          autocomplete="new-password"
          minlength="12"
          required
        >

        <button type="submit">
          Guardar nueva contraseña
        </button>
      </form>

      <p
        id="mensaje-restablecer"
        class="mensaje-formulario"
        role="status"
        aria-live="polite"
      >
        Verificando acceso...
      </p>

      <div class="opciones-cuenta">
        <a href="recuperar-contrasena.html">
          Solicitar otro enlace
        </a>
      </div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="restablecer-contrasena.js"></script>
</body>
</html>
