<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gestión de usuarios | CEIN Manuela Sáenz</title>

  <link rel="stylesheet" href="estilos.css">

  <style>
    body {
      margin: 0;
      background: #f4f6f8;
      color: #253238;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    .contenedor-usuarios {
      width: min(1100px, 92%);
      margin: 32px auto;
    }

    .cabecera-usuarios {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .cabecera-usuarios h1 {
      color: #0f3f4e;
      margin-bottom: 4px;
    }

    .aviso-usuarios {
      background: #fff7df;
      border-left: 4px solid #f4b942;
      border-radius: 8px;
      padding: 16px;
      margin: 24px 0;
    }

    .herramientas-usuarios {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: end;
      margin-bottom: 24px;
    }

    .campo-busqueda {
      flex: 1;
      min-width: 220px;
    }

    .campo-busqueda label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .campo-busqueda input,
    .tarjeta-usuario select {
      padding: 11px;
      border: 1px solid #bacbd1;
      border-radius: 8px;
      background: white;
      font: inherit;
      max-width: 100%;
    }

    .campo-busqueda input {
      width: 100%;
    }

    .lista-usuarios {
      display: grid;
      gap: 18px;
    }

    .tarjeta-usuario {
      padding: 24px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 4px 16px rgba(15, 63, 78, 0.08);
      overflow-wrap: anywhere;
    }

    .tarjeta-usuario h2 {
      margin-top: 0;
      color: #155e75;
      font-size: 1.2rem;
    }

    .acciones-usuario {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 16px;
    }

    .boton-usuarios {
      display: inline-block;
      padding: 11px 16px;
      background: #155e75;
      color: white;
      border: 0;
      border-radius: 8px;
      text-decoration: none;
      font: inherit;
      cursor: pointer;
    }

    .boton-usuarios:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .estado-usuario {
      display: inline-block;
      padding: 4px 10px;
      background: #e8f6f8;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="contenedor-usuarios">

    <header class="cabecera-usuarios">
      <div>
        <h1>Gestión de usuarios</h1>
        <p>CEIN Manuela Sáenz</p>
      </div>

      <a href="panel.html" class="boton-usuarios">
        Volver al panel
      </a>
    </header>

    <p id="estado-acceso" role="status">
      Verificando permisos...
    </p>

    <section id="contenido-usuarios" hidden>

      <div class="aviso-usuarios">
        Verifique que la persona pertenezca al personal autorizado
        antes de aprobar su cuenta. Asignar el rol Administrador
        permite gestionar usuarios y contenidos.
      </div>

      <div class="herramientas-usuarios">
        <div class="campo-busqueda">
          <label for="buscar-usuario">
            Buscar por nombre o correo
          </label>

          <input
            type="search"
            id="buscar-usuario"
            placeholder="Escriba para buscar..."
          >
        </div>

        <button
          type="button"
          id="actualizar-usuarios"
          class="boton-usuarios"
        >
          Actualizar lista
        </button>
      </div>

      <p
        id="mensaje-usuarios"
        role="status"
        aria-live="polite"
      ></p>

      <div id="lista-usuarios" class="lista-usuarios"></div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="usuarios.js"></script>
</body>
</html>
